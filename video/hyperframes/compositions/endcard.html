  <script>
    const tl = gsap.timeline({ paused: true });

    // The ball drops in and takes three decaying bounces: gravity in, gravity
    // out, each apex 42% of the last. One tween per flight, eased as a parabola.
    const floor = 0;
    const drops = [{ from: -1100, dur: 0.42 }];
    tl.fromTo("#ec-ball-art", { y: -1100 }, { y: floor, duration: 0.42, ease: "power2.in" }, 0);
    let t = 0.42;
    let height = 300;
    for (let i = 0; i < 3; i += 1) {
      const half = 0.16 * Math.sqrt(height / 300) + 0.06;
      tl.to("#ec-ball-art", { y: -height, duration: half, ease: "power2.out" }, t);
      tl.to("#ec-ball-art", { y: floor, duration: half, ease: "power2.in" }, t + half);
      t += half * 2;
      height *= 0.42;
    }
    tl.fromTo("#ec-ball-art", { rotation: -200 }, { rotation: 24, duration: t, ease: "power1.out", transformOrigin: "50% 50%" }, 0);
    // Squash on the first, hardest landing only.
    tl.fromTo("#ec-ball-art", { scaleY: 1, scaleX: 1 }, { scaleY: 0.84, scaleX: 1.1, duration: 0.05, ease: "power2.out", transformOrigin: "50% 100%" }, 0.40);
    tl.to("#ec-ball-art", { scaleY: 1, scaleX: 1, duration: 0.12, ease: "power2.out" }, 0.45);

    tl.fromTo("#ec-shadow", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "power2.in" }, 0);
    tl.fromTo("#ec-glow", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0.40);

    // Title: letters knocked up into place by the first landing.
    tl.fromTo(".ec-l", { opacity: 0, y: 90, filter: "blur(10px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "back.out(1.6)", stagger: 0.035 }, 0.5);
    tl.fromTo("#ec-rule-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out", transformOrigin: "50% 50%" }, 0.9);
    tl.fromTo(".ec-w", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.28 }, 1.1);
